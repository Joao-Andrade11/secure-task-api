spring.application.name=secure-task-api

# Database. Environment variables override local defaults.
spring.datasource.url=${DB_URL:jdbc:h2:mem:tododb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secure defaults: operational consoles and API documentation are opt-in.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Credentials must be provided outside the dev/test profiles.
spring.security.user.name=${API_USERNAME}
spring.security.user.password=${API_PASSWORD}
spring.security.user.roles=ADMIN

# Request and serialization hardening.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
